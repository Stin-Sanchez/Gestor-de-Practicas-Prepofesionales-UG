services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"        # solo local: Caddy entra por aquí
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - uploads:/var/www/html/storage/uploads
      - logs:/var/www/html/storage/logs
      - ./config/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
      - ./config/vhost.conf:/etc/apache2/sites-available/000-default.conf:ro

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS}
    volumes:
      - dbdata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/2-seeds.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      retries: 5
    # sin "ports": la BD solo es visible para el contenedor app

volumes:
  uploads: {}
  logs: {}
  dbdata: {}
